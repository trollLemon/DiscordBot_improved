name: Build and publish classification service to docker hub

on:
  push:
     tags:
      - 'classification-v*.*.*'
env:
  REGISTRY: docker.io
  API_IMAGE_NAME: trolllemon/classification-api
  WORKER_IMAGE_NAME: trolllemon/classification-worker

jobs:
  build-and-publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
      - name: get tag from commit
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Latest tag: $TAG"
          echo "Extracting version from tag"
          TAG_SEM=$(echo "$TAG" | awk -F'-' '{print $2}')
          echo "version=${TAG_SEM}_edge" >> $GITHUB_ENV
      - name: Build and push the API image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./classification
          file: ./classification/Dockerfile
          target: api
          tags: ${{ env.API_IMAGE_NAME }}:${{ env.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
      - name: Build and push the worker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./classification
          file: ./classification/Dockerfile
          target: worker
          tags: ${{ env.WORKER_IMAGE_NAME }}:${{ env.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
