services:
  bot:
    image: trolllemon/discordbot:v0.1.0
    environment:
      # you will need to set these two env vars prior to running the deployment.
      - DISCORD_TOKEN=<put your token here>
      - REDIS_PASS=<put a password here>
      # no need to change these.
      - GOMANIP_URL=http://gomanip:8080
      - CLASSIFICATION_URL=http://classification:8081
      - DATABASE_DSN=redis:6379
      - RANDOM_WORD_SET_NAME=words 
      - REDIS_SET_NUM=0
      # if you are getting timeout errors, increase these variables
      - GOMANIP_TIMEOUT=30s
      - CLASSIFICATION_TIMEOUT=5m
    networks:
      - network
    restart: "always"

  gomanip:
    image: trolllemon/gomanip:v0.1.0
    command: ["--pretty_print", "--num_workers", "4"]
    networks:
      - network
    restart: "always"
  redis:
    image: "redis:alpine"
    mem_limit: "2048m"
    command: ["redis-server", "--save", "120", "1"]
    networks:
      - network

  worker-data:
    image: "redis:alpine"
    mem_limit: "2048m"
    command: [ "redis-server", "--save", "120", "1" ]
    networks:
      - network
    restart: "always"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3config.json"]
    volumes:
      - seaweedfs-data:/data
      - ./s3config.json:/etc/seaweedfs/s3config.json:ro
    networks:
      - network
    restart: "always"

  classification:
    image: trolllemon/classification-api:v0.1.0
    environment:
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=classification
      - S3_SECRET_KEY=classification-secret
      - S3_BUCKET=images
      - S3_SECURE=false
    networks:
      - network
    depends_on:
      - worker-data
      - seaweedfs
    restart: "always"

  # Scale the worker pool with: docker compose up --scale classification-worker=N
  classification-worker:
    image: trolllemon/classification-worker:v0.1.0
    environment:
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=classification
      - S3_SECRET_KEY=classification-secret
      - S3_BUCKET=images
      - S3_SECURE=false
    networks:
      - network
    depends_on:
      - worker-data
      - seaweedfs
    restart: "always"

networks:
  network:
    driver: bridge

volumes:
  redis_data:
  seaweedfs-data:

