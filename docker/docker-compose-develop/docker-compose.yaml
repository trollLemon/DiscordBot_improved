services:
  bot:
    build: ../../bot/  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # you will need to set these two env vars prior to running the deployment.
      - DISCORD_TOKEN=
      - REDIS_PASS=
      # no need to change these.
      - GOMANIP_URL=http://gomanip:8080
      - CLASSIFICATION_URL=http://classification:8081
      - DATABASE_DSN=redis:6379
      - RANDOM_WORD_SET_NAME=words 
      - REDIS_SET_NUM=0
      # if you are getting timeout errors, increase these variables
      - GOMANIP_TIMEOUT=30s
      - CLASSIFICATION_TIMEOUT=5m
      # telemetry: assumes a SigNoz stack is already running on the host,
      # reachable via host.docker.internal (its OTLP collector on port 4318).
      - OTEL_EXPORTER_OTLP_ENDPOINT=host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=discord-bot
    networks:
      - network
    restart: "always"

  gomanip:
    build: ../../gomanip/ 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=gomanip-service
    networks:
      - network
    restart: "always"
  redis:
    image: "redis:alpine"
    mem_limit: "2048m"
    command: ["redis-server", "--save", "120", "1"]
    networks:
      - network

  worker-data:
    image: "redis:alpine"
    mem_limit: "2048m"
    command: [ "redis-server", "--save", "120", "1" ]
    networks:
      - network
    restart: "always"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3config.json"]
    volumes:
      - seaweedfs-data:/data
      - ./s3config.json:/etc/seaweedfs/s3config.json:ro
    networks:
      - network
    restart: "always"

  classification:
    build:
      context: ../../classification
      dockerfile: Dockerfile
      target: api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=classification
      - S3_SECRET_KEY=classification-secret
      - S3_BUCKET=images
      - S3_SECURE=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=classification-service
    networks:
      - network
    depends_on:
      - worker-data
      - seaweedfs
    restart: "always"

  # Scale the worker pool with: docker compose up --scale classification-worker=N
  classification-worker:
    build:
      context: ../../classification
      dockerfile: Dockerfile
      target: worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=classification
      - S3_SECRET_KEY=classification-secret
      - S3_BUCKET=images
      - S3_SECURE=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=classification-worker
    networks:
      - network
    depends_on:
      - worker-data
      - seaweedfs
    restart: "always"

networks:
  network:
    driver: bridge

volumes:
  redis_data:
  seaweedfs-data:

